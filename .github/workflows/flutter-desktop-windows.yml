name: Build Flutter Windows POS

on:
  pull_request:
    paths:
      - 'flutter_desktop/**'
      - '.github/workflows/flutter-desktop-windows.yml'
  push:
    paths:
      - 'flutter_desktop/**'
      - 'pos-demo/index.html'
      - 'pos-demo/split-bill.html'
      - 'pos-demo/vendor/**'
      - 'nohut-menu/**'
      - '.github/workflows/flutter-desktop-windows.yml'
  workflow_dispatch:

env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'

permissions:
  contents: read

concurrency:
  group: flutter-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-app:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Dart packages
        working-directory: flutter_desktop
        run: flutter pub get
      - name: Dart static analysis
        working-directory: flutter_desktop
        # Keep static errors/warnings fatal; newer Flutter releases emit info-only
        # SDK deprecations even for unchanged code (e.g. material.dart).
        run: flutter analyze --no-fatal-infos
      - name: Unit tests
        working-directory: flutter_desktop
        run: flutter test --reporter expanded
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserved HTML prototype regression
        run: node pos-demo/tests/logic.test.cjs
      - name: Install phone UI test dependencies
        working-directory: flutter_desktop/ui-tests
        run: npm ci
      - name: Install phone test browser
        working-directory: flutter_desktop/ui-tests
        run: npx playwright install chromium
      - name: Staff ordering workflows at 320, 390, 768 and 1280 pixels
        working-directory: flutter_desktop/ui-tests
        run: npm test
      - name: Validate Windows receipt script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($file in @('print-receipt.ps1','print-raster.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD "flutter_desktop/assets/printing/$file"), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
          $source = Get-Content 'flutter_desktop/assets/printing/print-raster.ps1' -Raw
          $native = [regex]::Match($source, "(?s)Add-Type -TypeDefinition @'\r?\n(.*?)\r?\n'@").Groups[1].Value
          if (!$native) { throw 'RAW spooler C# code missing' }
          Add-Type -TypeDefinition $native
      - name: Compile Windows desktop release
        working-directory: flutter_desktop
        run: flutter build windows --release
      - name: Bundle the Visual C++ runtime
        shell: pwsh
        run: |
          $release = 'flutter_desktop/build/windows/x64/runner/Release'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio with x64 C++ tools was not found' }
          $versions = Get-ChildItem -LiteralPath (Join-Path $vs 'VC/Redist/MSVC') -Directory |
            Where-Object Name -Match '^\d+\.\d+\.\d+$' |
            Sort-Object { [version] $_.Name } -Descending
          $runtime = $versions | ForEach-Object {
            Get-ChildItem -LiteralPath (Join-Path $_.FullName 'x64') -Directory -Filter 'Microsoft.VC*.CRT'
          } | Select-Object -First 1
          if (-not $runtime) { throw 'The redistributable x64 CRT was not found' }
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            Copy-Item -LiteralPath (Join-Path $runtime.FullName $dll) -Destination $release
          }
      - name: Record release checksums and source revision
        shell: pwsh
        run: |
          $release = 'flutter_desktop/build/windows/x64/runner/Release'
          $manifest = Get-ChildItem -LiteralPath $release -File -Recurse | ForEach-Object {
            [pscustomobject]@{ path = $_.FullName.Substring((Resolve-Path $release).Path.Length + 1); sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash }
          }
          @{ sourceRevision = '${{ github.sha }}'; files = @($manifest) } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "$release/build-manifest.json"
      - name: Build and test the Windows installer
        shell: pwsh
        run: |
          & ./flutter_desktop/windows/installer/build-setup.ps1 `
            -ReleaseDir flutter_desktop/build/windows/x64/runner/Release `
            -InstallerDir flutter_desktop/build/windows/installer -VerifyUpgrade
      - name: Upload the Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NohutFalafel-Windows-Setup
          path: flutter_desktop/build/windows/installer/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows program (folder with exe and DLL files)
        uses: actions/upload-artifact@v4
        with:
          name: NohutFalafel-Windows-Flutter
          path: flutter_desktop/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

      - name: Upload receipt artwork proof
        uses: actions/upload-artifact@v4
        with:
          name: NohutFalafel-Brand-Previews
          path: |
            flutter_desktop/build/receipt-brand-proof.png
            flutter_desktop/build/desktop-brand-proof.png
            flutter_desktop/build/staff-brand-*.png
          if-no-files-found: error
          retention-days: 14
