name: Build Flutter Windows POS

on:
  pull_request:
    paths:
      - 'flutter_desktop/**'
      - 'integration_gateway/**'
      - '.github/workflows/flutter-desktop-windows.yml'
  push:
    paths:
      - 'flutter_desktop/**'
      - 'integration_gateway/**'
      - 'pos-demo/index.html'
      - 'pos-demo/split-bill.html'
      - 'pos-demo/vendor/**'
      - 'nohut-menu/**'
      - '.github/workflows/flutter-desktop-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-app:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Dart packages
        working-directory: flutter_desktop
        run: flutter pub get
      - name: Dart static analysis
        working-directory: flutter_desktop
        run: flutter analyze
      - name: Unit tests
        working-directory: flutter_desktop
        run: flutter test --reporter expanded
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserved HTML prototype regression
        run: node pos-demo/tests/logic.test.cjs
      - name: Authenticated webhook gateway tests
        run: python -m unittest discover -s integration_gateway -p "test_*.py" -v
      - name: Compile Windows desktop release
        working-directory: flutter_desktop
        run: flutter build windows --release
      - name: Record release checksums and source revision
        shell: pwsh
        run: |
          $release = 'flutter_desktop/build/windows/x64/runner/Release'
          $manifest = Get-ChildItem -LiteralPath $release -File -Recurse | ForEach-Object {
            [pscustomobject]@{ path = $_.FullName.Substring((Resolve-Path $release).Path.Length + 1); sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash }
          }
          @{ sourceRevision = '${{ github.sha }}'; files = @($manifest) } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "$release/build-manifest.json"
      - name: Upload Windows program (folder with exe and DLL files)
        uses: actions/upload-artifact@v4
        with:
          name: NohutFalafel-Windows-Flutter
          path: flutter_desktop/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
