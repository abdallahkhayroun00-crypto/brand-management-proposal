name: Build Nohutcuk 3D STL and STEP

on:
  push:
    branches: [main]
    paths:
      - 'nohutcuk/CAD_Source/model_source_bundle.tar.gz.b64'
      - '.github/workflows/nohutcuk-cad-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nohutcuk-cad-build
  cancel-in-progress: false

jobs:
  cad:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract original prototype source
        run: |
          set -euo pipefail
          base64 --decode nohutcuk/CAD_Source/model_source_bundle.tar.gz.b64 | tar -xz -C nohutcuk
          mkdir -p nohutcuk/Docs nohutcuk/downloads
          python -m py_compile nohutcuk/CAD_Source/build_nohutcuk.py nohutcuk/CAD_Source/prepare_print_and_verify.py

      - name: Install CAD and mesh dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r nohutcuk/CAD_Source/requirements.txt 'networkx>=3.0'

      - name: Generate 16 separated parts, two merged STLs and STEP
        run: |
          set -o pipefail
          python nohutcuk/CAD_Source/build_nohutcuk.py nohutcuk | tee nohutcuk/Docs/CAD_BUILD_LOG.txt
          python nohutcuk/CAD_Source/prepare_print_and_verify.py nohutcuk | tee nohutcuk/Docs/MESH_CHECK_LOG.txt

      - name: Validate actual files
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('nohutcuk')
          assert len(list((root/'STL_Individual').glob('*.stl')))==16, 'Expected 16 standalone STLs'
          assert len(list((root/'STL_Print_Oriented').glob('*.stl')))==16, 'Expected 16 print-oriented STLs'
          assert len(list((root/'STL_Merged').glob('*.stl')))==2, 'Expected 2 combined STLs'
          assert len(list((root/'STEP').glob('*.step')))==2, 'Expected 2 STEP files'
          data=json.loads((root/'Docs'/'Mesh_Validation_Report.json').read_text())
          assert len(data['items'])==18, 'Expected 16 independent and 2 combined checks'
          one=next(x for x in data['items'] if x['file']=='NOHUTCUK_ONE_PIECE_SOLID_STATUE.stl')
          assert one['watertight'] and one['connected_components']==1, 'One-piece model failed'
          print('Verified STL/STEP and geometrical reports.')
          PY

      - name: Create complete ZIP download
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root=Path('nohutcuk')
          out=root/'downloads'/'NOHUTCUK_CAD_STL_COMPLETE_PROTOTYPE.zip'
          prefixes=['CAD_Source','STL_Individual','STL_Print_Oriented','STL_Merged','STEP','Docs']
          with ZipFile(out,'w',compression=ZIP_DEFLATED,compresslevel=7) as z:
              for prefix in prefixes:
                  for p in sorted((root/prefix).rglob('*')):
                      if p.is_file() and '__pycache__' not in p.parts:
                          z.write(p,p.relative_to(root))
              z.write(root/'README.md','README.md')
          print(f'{out}: {out.stat().st_size} bytes')
          PY

      - name: Commit generated files to nohutcuk only
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find nohutcuk/CAD_Source -type d -name __pycache__ -prune -exec rm -rf {} +
          git add nohutcuk/CAD_Source nohutcuk/STL_Individual nohutcuk/STL_Print_Oriented nohutcuk/STL_Merged nohutcuk/STEP nohutcuk/Docs nohutcuk/downloads
          if git diff --cached --quiet; then
            echo "No CAD changes to commit"
          else
            git commit -m "cad(nohutcuk): publish generated printable prototype STL, STEP and ZIP"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Published generated Nohutçuk files successfully"
                exit 0
              fi
              sleep 3
            done
            echo "Unable to push CAD outputs after five retries"
            exit 1
          fi
