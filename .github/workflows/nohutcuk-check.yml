name: Nohutçuk Simulator Checks

on:
  push:
    paths:
      - 'nohutcuk/**'
      - '.github/workflows/nohutcuk-check.yml'
  pull_request:
    paths:
      - 'nohutcuk/**'
      - '.github/workflows/nohutcuk-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    name: Syntax and reaction smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check nohutcuk/app.js
      - name: Check sound synthesizer syntax
        run: node --check nohutcuk/audio.js
      - name: Run simulated UI and reaction checks
        run: node nohutcuk/tests/smoke.mjs
      - name: Run original song and sound-effect tests
        run: node nohutcuk/tests/audio.mjs
      - name: Check spoken-voice module syntax
        run: node --check nohutcuk/voice.js
      - name: Verify sparse speech and multilingual snippets
        run: node nohutcuk/tests/voice.mjs
