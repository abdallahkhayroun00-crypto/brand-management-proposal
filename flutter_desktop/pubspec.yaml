name: nohut_falafel_desktop
description: Nohut Falafel Windows POS desktop with local SQLite and employee QR LAN.
publish_to: none
version: 0.6.6+12

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0
  sqlite3: ^3.7.1
  qr_flutter: ^4.1.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/menu.json
    - assets/staff.html
    - assets/printing/
    - assets/brand/
    - assets/brand/fonts/
  fonts:
    - family: Barlow Semi Condensed
      fonts:
        - asset: assets/brand/fonts/Barlow-Regular.ttf
        - asset: assets/brand/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/brand/fonts/Barlow-Bold.ttf
          weight: 700
    - family: Bree Serif
      fonts:
        - asset: assets/brand/fonts/BreeSerif-Regular.ttf

