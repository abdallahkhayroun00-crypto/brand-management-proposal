[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Bench target: Waveshare 1.9-inch 170x320 SPI IPS (ST7789V2).
; Pin numbers are in include/pins.h. Verify YOUR ESP32-S3 board before wiring.
lib_deps =
    moononournation/GFX Library for Arduino@^1.6.5

build_flags =
    -D NOHUT_ENABLE_TOUCH=0
    -D NOHUT_ENABLE_TOF=0
    -D NOHUT_ENABLE_SERVO=0
    -D NOHUT_ENABLE_AUDIO=0
