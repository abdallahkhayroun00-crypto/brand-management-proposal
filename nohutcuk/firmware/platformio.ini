; Nohutçuk color-face firmware.
; Preferred purchase target (2026-10-27): Waveshare 2.4" SPI TFT ILI9341, SKU 18366.
; Legacy bench/reference display stays available but is NOT on the purchase list.
[platformio]
default_envs = esp32-s3-ili9341-24

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    moononournation/GFX Library for Arduino@^1.6.5
build_flags =
    -D NOHUT_ENABLE_TOUCH=0
    -D NOHUT_ENABLE_TOF=0
    -D NOHUT_ENABLE_SERVO=0
    -D NOHUT_ENABLE_AUDIO=0

[env:esp32-s3-ili9341-24]
; Default: 2.4" ILI9341, 240x320 portrait rotated to 320x240 landscape.
build_flags =
    ${env.build_flags}
    -D NOHUT_DISPLAY_ILI9341=1

[env:esp32-s3-st7789-19]
; Old proof of concept only. Do not buy 1.9" in addition to 2.4".
build_flags =
    ${env.build_flags}
    -D NOHUT_DISPLAY_ILI9341=0
