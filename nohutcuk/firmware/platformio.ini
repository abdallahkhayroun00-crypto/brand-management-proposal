; Nohutçuk color-face firmware.
; Selected purchase target (2026-10-27): 3.2" SPI TFT ILI9341, no touch (Voltaj MZK-6 candidate).
; MUST verify exact SPI breakout and pin labels before wiring; Arduino Mega 16-bit shield is NOT interchangeable.
; Legacy bench/reference display stays available but is NOT on the purchase list.
[platformio]
default_envs = esp32-s3-ili9341-32

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    moononournation/GFX Library for Arduino@^1.6.5
build_flags =
    -D NOHUT_ENABLE_TOUCH=0
    -D NOHUT_ENABLE_TOF=0
    -D NOHUT_ENABLE_SERVO=0
    -D NOHUT_ENABLE_AUDIO=0

[env:esp32-s3-ili9341-32]
; SELECTED: 3.2" ILI9341 SPI no-touch, native 240x320 rotated to 320x240.
; LCD pins in pins.h are PROVISIONAL until a particular breakout is confirmed.
build_flags =
    ${env.build_flags}
    -D NOHUT_DISPLAY_ILI9341=1

[env:esp32-s3-ili9341-24]
; DEPRECATED: the previous 2.4" display choice. Same controller and pixel resolution,
; but different breakout/connector and physical dimensions. Do not buy.
build_flags =
    ${env.build_flags}
    -D NOHUT_DISPLAY_ILI9341=1

[env:esp32-s3-st7789-19]
; Old proof of concept only. Do not buy 1.9" in addition to 2.4".
build_flags =
    ${env.build_flags}
    -D NOHUT_DISPLAY_ILI9341=0
