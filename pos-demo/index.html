function ringOnline(){if(!onlineSoundEnabled)return;try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!onlineAudio)onlineAudio=new AC();if(onlineAudio.state==="suspended")onlineAudio.resume();[0,.2,.4].forEach(function(d){var o=onlineAudio.createOscillator(),g=onlineAudio.createGain(),t=onlineAudio.currentTime+d;o.frequency.setValueAtTime(750,t);o.frequency.linearRampToValueAtTime(1100,t+.14);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.17);o.connect(g);g.connect(onlineAudio.destination);o.start(t);o.stop(t+.19)})}catch(e){}}
