function cashBookPage(){
 var db=cashBook(),c=cashActive(),past=db.sessions.slice().reverse().slice(0,15);
 return '<section class="panel" style="margin-top:18px"><h3>Günlük Kasa · Açılış / Kapanış</h3>'+
 '<p class="sub">Demo: yalnızca restoran Nakit hareketleri. Kart ve platform tahsilatı fiziksel nakit sayılmaz.</p>'+
 (!c?'<div class="form-row"><label>Açılış bakiyesi (₺)<input id="cash-open" class="field" inputmode="decimal" placeholder="500"></label><button class="primary" data-cash-action="open">Kasayı Aç</button></div><p class="info-alert">Aktif kasa yok; eski işlemler demo kayıtlarında kalır.</p>':
 '<p class="info">Kasa #'+c.id+' · '+hubTime(c.openedAt)+' · Açılış '+price(c.openingCents/100)+'</p>'+
 '<div class="metrics">'+box("Beklenen Nakit",price(cashExpected(c)/100),"▤","Nakit tahsilat − iade + kasa hareketleri")+'</div>'+
 '<div class="form-row"><label>Hareket<select id="cash-kind" class="field"><option value="in">Kasa Giriş</option><option value="out">Kasa Çıkış</option></select></label><label>Tutar ₺<input id="cash-amount" class="field" inputmode="decimal" placeholder="100"></label><label>Açıklama<input id="cash-note" class="field" maxlength="140"></label><button class="secondary" data-cash-action="move">Hareketi Kaydet</button></div>'+
 '<div class="form-row"><label>Sayılan Nakit ₺<input id="cash-counted" class="field" inputmode="decimal" placeholder="500"></label><button class="primary" data-cash-action="close">Kasayı Kapat</button></div>')+
 '<h3 style="margin-top:15px">Kasa Oturumları</h3>'+
 (past.length?'<div class="table-scroll"><table class="table"><thead><tr><th>Açılış</th><th>Beklenen</th><th>Sayılan</th><th>Fark</th><th>Durum</th></tr></thead><tbody>'+past.map(function(x){return '<tr><td>'+hubTime(x.openedAt)+' · '+price(x.openingCents/100)+'</td><td>'+price((x.closedAt?x.expectedCents:cashExpected(x))/100)+'</td><td>'+(x.closedAt?price(x.countedCents/100):"—")+'</td><td>'+(x.closedAt?price(x.differenceCents/100):"—")+'</td><td>'+(x.closedAt?"Kapalı":"Açık")+'</td></tr>'}).join('')+'</tbody></table></div>':'<p class="empty">Henüz kasa oturumu yok.</p>')+
 '<p class="footnote">Gerçek kasa, banka POS ve ÖKC bağlantısı değildir. Geçmişteki hareketler kapanan kasayı geriye dönük değiştirmez.</p></section>';
}
var cashBasePage=paymentPage;paymentPage=function(){return cashBasePage()+cashBookPage()};
document.addEventListener("click",function(e){
 var b=e.target.closest("button[data-cash-action]");if(!b||mode!=="admin")return;
 var action=b.dataset.cashAction,db=cashBook(),c=cashActive(),now=new Date().toISOString();
 if(action==="open"){
  if(c)return;
  var opening=moneyCents((document.getElementById("cash-open")||{}).value);
  if(!Number.isInteger(opening)){toast("Geçerli açılış bakiyesi gerekli.");return}
  db.sessions.push({id:db.next++,openedAt:now,openingCents:opening,openedBy:"Kasa (PC)",closedAt:null});
 }else if(action==="move"){
  if(!c)return;
  var cents=moneyCents(document.getElementById("cash-amount").value),reason=document.getElementById("cash-note").value.trim();
  var signed=document.getElementById("cash-kind").value==="out"?-cents:cents;
  if(!Number.isInteger(cents)||cents<=0||!reason){toast("Tutar ve açıklama zorunlu.");return}
  if(cashExpected(c)+signed<0){toast("Kasa negatife düşemez.");return}
  db.movements.push({id:db.next++,sessionId:c.id,at:now,cents:signed,reason:reason,by:"Kasa (PC)"});
 }else if(action==="close"){
  if(!c)return;
  var counted=moneyCents((document.getElementById("cash-counted")||{}).value);
  if(!Number.isInteger(counted)){toast("Sayılan nakdi girin.");return}
  c.expectedCents=cashExpected(c,now);c.countedCents=counted;
  c.differenceCents=counted-c.expectedCents;c.closedAt=now;c.closedBy="Kasa (PC)";
 }else return;
 save();render();toast("Kasa işlemi kaydedildi (demo).");
});

render();
})();
</script></body></html>
