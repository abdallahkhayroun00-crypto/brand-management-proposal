{background:#fff0e9;color:#ad523a}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.table-scroll{overflow-x:auto}.table{width:100%;border-collapse:collapse;min-width:640px}.table th{text-align:left;text-transform:uppercase;letter-spacing:1px;font-size:10px;color:#93a398;font-weight:800;padding:13px 10px;border-bottom:1px solid var(--border)}.table td{font-size:12px;padding:14px 10px;border-bottom:1px solid #eef1ed;vertical-align:middle}.table tr:last-child td{border-bottom:0}.table tr:hover td{background:#fbfcfa}.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:99px;font-size:10px;font-weight:800;background:#edf5e9;color:#42704a}.badge.orange{background:#fff3df;color:#a37428}.badge.blue{background:#eaf1fc;color:#5579ac}.badge.red{background:#fbece7;color:#b86955}.small-muted{color:var(--muted);font-size:11px}.table-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.table-card{text-align:left;border:1px solid var(--border);background:white;border-radius:17px;padding:17px;min-height:138px;transition:.18s}.table-card:hover{border-color:#9fc2a9;transform:translateY(-2px)}.table-card.occupied{background:#edf5eb;border-color:#b8d0bc}.table-card h3{margin:10px 0 8px;font-size:18px}.table-card span{display:block;font-size:11px;color:#6b8972}.table-card strong{display:block;margin-top:8px;font-size:16px}.detail{margin-top:19px;padding:20px;background:#f8faf7;border-radius:16px;border:1px solid var(--border)}.detail h3{margin:0 0 14px}.line{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;gap:12px}.line:last-child{border:0}.line strong{font-variant-numeric:tabular-nums}.line.tot{font-size:17px;font-weight:800}.form-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}.field{background:white;border:1px solid #dbe5dc;border-radius:10px;color:var(--text);padding:11px 12px;min-height:40px;max-width:100%}select.field{flex:1;min-width:160px}.seg{display:flex;gap:5px;background:#eaf0e9;border-radius:11px;padding:4px;margin:12px 0}.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:11px 8px;color:#66796a;font-weight:800;font-size:12px}.seg button.active{background:white;color:var(--pine);box-shadow:0 1px 5px #0000000e}.info{background:#f2f6ee;padding:15px;border-radius:12px;color:#627865;font-size:12px;line-height:1.7}.staffcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.staffcard{border:1px solid var(--border);border-radius:15px;background:white;padding:18px}.staff-avatar{width:44px;height:44px;border-radius:14px;background:#e6efe3;color:var(--pine);display:grid;place-items:center;font-weight:850;font-size:20px}.staffcard h3{margin:12px 0 4px;font-size:16px}.staffcard p{margin:0 0 12px;color:var(--muted);font-size:12px}.list-dots{list-style:none;padding:0;margin:0}.list-dots li{border-bottom:1px solid #ebeee9;padding:12px 0;font-size:13px;display:flex;justify-content:space-between;gap:20px}.list-dots li:last-child{border:0}.mini-box{background:#f5f8f3;border-radius:13px;padding:15px;margin-top:12px}.mini-box b{display:block;font-size:16px}.mini-box small{color:var(--muted);font-size:11px}.footnote{font-size:11px;color:#839386;line-height:1.7;margin:18px 0}.worker-area{display:grid;grid-template-columns:1fr minmax(310px,425px);gap:25px;align-items:start}.worker-intro{padding:30px}.worker-intro h2{font-size:31px;letter-spacing:-1.3px;line-height:1.15;margin:12px 0}.worker-intro p{font-size:14px;color:#768479;max-width:390px;line-height:1.8}.phone{background:#fff;border:8px solid #233a2d;border-radius:35px;min-height:630px;box-shadow:0 22px 60px #243c2b20;overflow:hidden}.phone-top{background:var(--pine);color:white;padding:23px 19px 18px}.phone-top strong{font-size:18px}.phone-top small{color:#b9d2c2;font-size:11px;display:block;margin-top:6px}.phone-body{padding:16px}.phone-tables{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.phone-card{background:#f4f7f1;border:1px solid #e2eadd;border-radius:14px;padding:16px;text-align:left;color:var(--pine)}.phone-card strong{display:block;font-size:17px}.phone-card small{display:block;margin-top:8px;color:#68836d}.phone-card.open{background:#e8f1e6;border-color:#9abf9c}.phone-dock{display:flex;justify-content:space-between;gap:5px;border-top:1px solid var(--border);margin-top:25px;padding:14px 4px 6px;color:#7c8c81;font-size:11px;font-weight:750}.phone-dock button{border:0;background:transparent;font-size:11px;color:var(--pine);font-weight:750}.phone-form{padding:15px;border-radius:15px;background:#f5f8f3;margin-top:14px}.phone-form select{width:100%;margin-bottom:9px}.tiny{font-size:10px!important}.empty{border:1px dashed #d3e0d3;border-radius:14px;padding:20px;text-align:center;font-size:13px;color:var(--muted)}.toast{position:fixed;bottom:24px;right:24px;background:#173e2d;color:white;padding:14px 19px;border-radius:12px;box-shadow:0 14px 35px #0003;font-size:13px;z-index:100;max-width:350px}.only-print{display:none}

</style></head><body><div id="root"></div><div id="print-sheet" class="only-print"></div><script>
(function(){
"use strict";
var MENU=[{id:"f",name:"Falafel Dürüm",price:140},{id:"n",name:"Nohut Özel Dürüm",price:185},{id:"p",name:"Falafel Porsiyon",price:200},{id:"h",name:"Sade Humus",price:160},{id:"a",name:"Büyük Ayran",price:40},{id:"k",name:"Küçük Ayran",price:25},{id:"s",name:"Şambali Tatlısı",price:70}];
var INITIAL={employees:[{id:1,name:"Ömer",role:"Yönetici",active:true},{id:2,name:"Mehmet",role:"Personel",active:true},{id:3,name:"Abdallah",role:"Personel",active:true}],orders:[{id:1021,source:"Masa",table:2,staff:"Mehmet",at:"12:08",items:[{id:"f",qty:2},{id:"a",qty:2}],payments:[],events:["12:08 · Mehmet — Sipariş açıldı"]},{id:1022,source:"Masa",table:4,staff:"Abdallah",at:"12:17",items:[{id:"n",qty:1},{id:"h",qty:1}],payments:[{method:"Nakit",amount:150,by:"Ömer"}],events:["12:17 · Abdallah — Sipariş açıldı","12:34 · Ömer — Kısmi nakit tahsilatı"]},{id:1023,source:"Gel-Al",table:null,staff:"Mehmet",at:"12:21",items:[{id:"f",qty:2}],payments:[{method:"Kart",amount:280,by:"Ömer"}],events:["12:21 · Mehmet — Sipariş açıldı","12:27 · Ömer — Kart ödendi"]},{id:1024,source:"Telefon",table:null,staff:"Abdallah",at:"12:40",items:[{id:"f",qty:1}],payments:[],events:["12:40 · Abdallah — Telefon siparişi"]},{id:1025,source:"Yemeksepeti",table:null,staff:"Platform",at:"12:48",items:[{id:"p",qty:1}],payments:[{method:"Platform",amount:200,by:"Yemeksepeti"}],events:["12:48 · Yemeksepeti — Örnek içe aktarma"]},{id:1026,source:"Trendyol Go",table:null,staff:"Platform",at:"12:51",items:[{id:"n",qty:1},{id:"k",qty:1}],payments:[{method:"Platform",amount:210,by:"Trendyol Go"}],events:["12:51 · Trendyol Go — Örnek içe aktarma"]}]};
var data=JSON.parse(JSON.stringify(INITIAL));
var tab="dashboard", mode="admin",selected=1021,filter="Tümü",method="Nakit",split="Tamamı",worker=2,workerTable=null;
var pages=[["dashboard","◫","Genel Bakış"],["orders","▣","Siparişler"],["tables","▦","Masalar"],["payments","◈","Ödemeler & Kasa"],["employees","♙","Personel Yönetimi"],["reports","▥","Raporlar"],["settings","⚙","Ayarlar"]];
var sources=["Masa","Gel-Al","Telefon","Yemeksepeti","Trendyol Go"];
function money(n){return (Number(n)||0).toLocaleString("tr-TR",{maximumFractionDigits:2})+" ₺"}
function safe(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function item(id){return MENU.find(function(x){return x.id===id})||{id:id,name:"Ürün",price:0}}
function total(o){return o.items.reduce(function(s,i){return s+item(i.id).price*i.qty},0)}
function paid(o){return o.payments.reduce(function(s,p){return s+p.amount},0)}
function due(o){return Math.max(0,total(o)-paid(o))}
function status(o){return due(o)<.001?"Ödendi":paid(o)>0?"Kısmi Ödendi":"Hazırlanıyor"}
function statusClass(o){return due(o)<.001?"":paid(o)>0?"blue":"orange"}
function hasSource(s){return data.orders.filter(function(o){return o.source===s})}
function sum(arr,fn){return arr.reduce(function(s,o){return s+fn(o)},0)}
function metrics(){return {sales:sum(data.orders,total),cash:sum(data.orders,function(o){return sum(o.payments.filter(function(p){return p.method==="Nakit"}),function(p){return p.amount})}),card:sum(data.orders,function(o){return sum(o.payments.filter(function(p){return p.method==="Kart"}),function(p){return p.amount})}),platform:sum(data.orders,function(o){return sum(o.payments.filter(function(p){return p.method==="Platform"}),function(p){return p.amount})}),pending:sum(data.orders,due)}}
function emp(id){return data.employees.find(function(e){return e.id===id})}
function order(id){return data.orders.find(function(o){return o.id===Number(id)})}
function currentEmp(){return emp(worker)||data.employees[0]}
function countOpen(){return data.orders.filter(function(o){return o.source==="Masa"&&due(o)>0}).length}
function iconCard(label,num,icon,sub){return '<div class="metric"><div class="metric-top"><span>'+label+'</span><span class="metric-icon">'+icon+'</span></div><strong>'+num+'</strong><small>'+sub+'</small></div>'}
function orderRows(arr){if(!arr.length)return '<div class="empty">Bu bölümde henüz kayıt yok.</div>';return '<div class="table-scroll"><table class="table"><thead><tr><th>Sipariş</th><th>Kaynak</th><th>Personel</th><th>Tutar</th><th>Durum</th><th></th></tr></thead><tbody>'+arr.map(function(o){return '<tr><td><b>#'+o.id+'</b><div class="small-muted">'+o.at+(o.table?" · Masa "+o.table:"")+'</div></td><td>'+safe(o.source)+'</td><td>'+safe(o.staff)+'</td><td><b>'+money(total(o))+'</b></td><td><span class="badge '+statusClass(o)+'">'+status(o)+'</span></td><td><button class="quiet" data-open="'+o.id+'">İncele</button></td></tr>'}).join("")+'</tbody></table></div>'}
function dashboard(){var m=metrics(),bars=sources.map(function(s){var v=sum(hasSource(s),total);return {name:s,v:v}}),max=Math.max(1,...bars.map(function(x){return x.v}));return '<div class="hero"><div><span class="eyebrow" style="color:#acd0b8">PAZAR · ÖRNEK İŞLETME GÖRÜNÜMÜ</span><h2>Merhaba, Ömer 👋</h2><p>Nohut Falafel operasyonlarını tek panelden takip edin.</p></div><div class="hero-badge">Açık masalar<strong>'+countOpen()+'</strong>Canlı örnek</div></div><div class="metrics">'+iconCard("Toplam Satış",money(m.sales),"↗","Tüm kaynaklar · örnek veri")+iconCard("Nakit Tahsilat",money(m.cash),"▤","Kasada tahsil edilen")+iconCard("Kart Tahsilat",money(m.card),"▣","Restoran POS tahsilatı")+iconCard("Bekleyen Ödeme",money(m.pending),"◷","Henüz ödenmemiş tutar")+'</div><div class="grid2"><section class="panel"><div class="panel-header"><div><h3>Satış Kanalları</h3><p class="sub">Tüm siparişlerin kaynağa göre dağılımı</p></div><span class="pill">Demo verisi</span></div>'+bars.map(function(x){return '<div class="source-bar"><label>'+safe(x.name)+'</label><div class="bar-bg"><div class="bar-fill" style="width:'+Math.max(1,x.v/max*100)+'%"></div></div><b>'+money(x.v)+'</b></div>'}).join("")+'<div class="summary-row"><span>Toplam kayıtlı satış</span><strong>'+money(m.sales)+'</strong></div></section><section class="panel"><div class="panel-header"><div><h3>Tahsilat Özeti</h3><p class="sub">Satış ile kasaya gelen para farklıdır</p></div></div><div class="payline"><span class="round">▤</span><div><small>Nakit</small><b>'+money(m.cash)+'</b></div></div><div class="payline"><span class="round">▣</span><div><small>Kart / POS</small><b>'+money(m.card)+'</b></div></div><div class="payline"><span class="round">↗</span><div><small>Platformda tahsil edilmiş brüt satış</small><b>'+money(m.platform)+'</b></div></div><p class="info">Platform tutarı kasadaki nakit veya POS geliri değildir. Komisyon ve gerçek banka ödemeleri bu demoda hesaplanmaz.</p></section></div><div class="section-title"><h2>Son Siparişler</h2><button class="quiet" data-tab="orders">Tümünü Gör ↗</button></div><div class="panel">'+orderRows(data.orders.slice().reverse().slice(0,5))+'</div>'}
function sourceFilters(){return '<div class="actions">'+["Tümü"].concat(sources).map(function(x){return '<button class="'+(filter===x?'primary':'quiet')+'" data-filter="'+safe(x)+'">'+safe(x)+'</button>'}).join("")+'</div>'}
function orderView(){var arr=data.orders.filter(function(o){return filter==="Tümü"||o.source===filter});return '<div class="section-title"><div><h2>Tüm Siparişler</h2><p class="sub">Sipariş açın, ek ürün ekleyin, bölün ve ödeme simüle edin.</p></div><button class="primary" data-new="Masa">+ Sipariş Oluştur</button></div>'+sourceFilters()+'<div class="panel" style="margin-top:15px">'+orderRows(arr)+'</div>'+detailView()}
function detailView(){var o=order(selected);if(!o)return "";var rem=due(o),opts=MENU.map(function(x){return '<option value="'+x.id+'">'+safe(x.name)+' — '+money(x.price)+'</option>'}).join("");return '<div class="section-title"><h2>Sipariş Detayı <span style="color:#8a9c8e">#'+o.id+'</span></h2><span class="badge '+statusClass(o)+'">'+status(o)+'</span></div><div class="grid2"><section class="panel"><div class="panel-header"><div><h3>'+safe(o.source)+(o.table?" · Masa "+o.table:"")+'</h3><p class="sub">Siparişi alan: '+safe(o.staff)+' · '+o.at+'</p></div><button class="quiet" data-print="'+o.id+'">⎙ Fiş Önizlemesi</button></div>'+o.items.map(function(i){return '<div class="line"><span>'+i.qty+'× '+safe(item(i.id).name)+'</span><strong>'+money(item(i.id).price*i.qty)+'</strong></div>'}).join("")+'<div class="line tot"><span>Toplam</span><strong>'+money(total(o))+'</strong></div><div class="line"><span>Tahsil edilen</span><strong>'+money(paid(o))+'</strong></div><div class="line tot"><span>Kalan</span><strong>'+money(rem)+'</strong></div><div class="form-row"><select class="field" id="addProduct">'+opts+'</select><button class="secondary" data-add="'+o.id+'">+ Ek Sipariş</button></div><p class="footnote">Ek ürün yalnızca açık hesaba eklenir. Gerçek sistemde ek fiş ayrı yazdırılacaktır.</p></section><section class="panel"><h3>Ödeme Simülasyonu</h3><p class="sub">Gerçek bankaya veya POS cihazına bağlanmaz.</p><div class="seg">'+["Nakit","Kart"].map(function(x){return '<button class="'+(method===x?"active":"")+'" data-method="'+x+'">'+x+'</button>'}).join("")+'</div><div class="seg">'+["Tamamı","Yarısı","Özel Tutar"].map(function(x){return '<button class="'+(split===x?"active":"")+'" data-split="'+x+'">'+x+'</button>'}).join("")+'</div><p class="small-muted">Ödeme sonrası kalan hesap otomatik güncellenir. Karışık ödeme de test edilebilir.</p><button class="primary" style="width:100%;margin-top:12px" data-pay="'+o.id+'" '+(rem===0||o.source==="Yemeksepeti"||o.source==="Trendyol Go"?"disabled":"")+'>'+method+' Ödeme Kaydet (Demo)</button><div class="mini-box"><small>İşlem geçmişi</small>'+o.events.slice().reverse().map(function(t){return '<div style="padding-top:10px;font-size:11px">'+safe(t)+'</div>'}).join("")+'</div></section></div>'}
function tableView(){var arr=Array.from({length:8},function(_,i){var n=i+1,o=data.orders.find(function(x){return x.source==="Masa"&&x.table===n&&due(x)>0});return {n:n,o:o}});return '<div class="section-title"><div><h2>Masa Planı</h2><p class="sub">Boş masalara yeni sipariş açın; dolu masaları yönetin.</p></div><span class="badge">'+countOpen()+' Açık Masa</span></div><div class="table-cards">'+arr.map(function(t){return '<button class="table-card '+(t.o?'occupied':'')+'" data-table="'+t.n+'"><span>'+(t.o?"● Dolu · Açık hesap":"○ Boş · Yeni sipariş")+'</span><h3>Masa '+t.n+'</h3>'+(t.o?'<strong>'+money(due(t.o))+'</strong><span>Alınan: '+safe(t.o.staff)+'</span>':'<strong>+ Sipariş Aç</strong>')+'</button>'}).join("")+'</div>'+(order(selected)&&order(selected).source==="Masa"?detailView():"")}
function paymentView(){var m=metrics();return '<div class="section-title"><div><h2>Ödemeler & Kasa</h2><p class="sub">Ödeme yöntemleri, açık hesaplar ve tahsilat kontrolü.</p></div><span class="pill">POS bağlı değil</span></div><div class="metrics">'+iconCard("Nakit",money(m.cash),"▤","Fiziksel tahsilat")+iconCard("Kart",money(m.card),"▣","POS işlemleri (demo)")+iconCard("Platform",money(m.platform),"⇄","Platformca tahsil edilen brüt")+iconCard("Kalan",money(m.pending),"◷","Açık hesap")+'</div><div class="panel"><div class="panel-header"><div><h3>Bekleyen Hesaplar</h3><p class="sub">Ödemeyi tamamlamak için siparişi açın.</p></div></div>'+orderRows(data.orders.filter(function(o){return due(o)>0}))+'</div><p class="footnote">Not: Kasa açılış tutarı, fiziksel sayım, iade ve platform komisyon raporları ileride Flutter/yerel arka uç ile geliştirilecektir.</p>'+detailView()}
function employeeView(){return '<div class="section-title"><div><h2>Personel Yönetimi</h2><p class="sub">Hesap oluşturma, düzenleme, yetki, pasifleştirme ve sipariş atfı.</p></div><button class="primary" data-user-add>+ Yeni Personel</button></div><div class="staffcards">'+data.employees.map(function(e){var n=data.orders.filter(function(o){return o.staff===e.name}).length;return '<div class="staffcard"><div class="staff-avatar">'+safe(e.name.slice(0,1).toUpperCase())+'</div><h3>'+safe(e.name)+'</h3><p>'+safe(e.role)+' · <span class="badge '+(e.active?"":"red")+'">'+(e.active?"Aktif":"Pasif")+'</span></p><div class="line"><span>Sipariş sayısı</span><strong>'+n+'</strong></div><div class="actions" style="margin-top:14px"><button class="quiet" data-user-edit="'+e.id+'">Düzenle</button><button class="'+(e.active?"danger":"secondary")+'" data-user-toggle="'+e.id+'" '+(e.id===1?"disabled":"")+'>'+(e.active?"Pasifleştir":"Aktifleştir")+'</button></div></div>'}).join("")+'</div><p class="info" style="margin-top:17px">Gerçek üründe hesaplar parola karmaları ve sunucu tarafı yetki kontrolü ile korunacak. Bu açık GitHub demosunda gerçek giriş/şifre ve müşteri verileri bulunmaz. Pasifleştirme geçmişi korur.</p>'}
function reportView(){var m=metrics(),items=MENU.map(function(p){return {name:p.name,qty:sum(data.orders,function(o){return sum(o.items.filter(function(i){return i.id===p.id}),function(i){return i.qty})})}}).sort(function(a,b){return b.qty-a.qty});return '<div class="section-title"><div><h2>Raporlar & Analiz</h2><p class="sub">Ürün, kanal ve personel performansı · demo verisi</p></div><button class="quiet" data-export>CSV İndir</button></div><div class="metrics">'+iconCard("Kayıtlı Sipariş",String(data.orders.length),"▣","Tüm kanallar")+iconCard("Ortalama Sepet",money(data.orders.length?m.sales/data.orders.length:0),"↗","Sipariş başına")+iconCard("Açık Hesap",money(m.pending),"◷","Ödenmemiş")+iconCard("Platform Brüt",money(m.platform),"⇄","Net ödeme değildir")+'</div><div class="grid2"><div class="panel"><h3>En Çok Satılan Ürünler</h3><ul class="list-dots">'+items.slice(0,7).map(function(i){return '<li><span>'+safe(i.name)+'</span><b>'+i.qty+' adet</b></li>'}).join("")+'</ul></div><div class="panel"><h3>Personel Siparişleri</h3><ul class="list-dots">'+data.employees.map(function(e){return '<li><span>'+safe(e.name)+'</span><b>'+data.orders.filter(function(o){return o.staff===e.name}).length+' sipariş</b></li>'}).join("")+'</ul><div class="mini-box"><small>Toplam satış</small><b>'+money(m.sales)+'</b></div></div></div>'}
function settingsView(){return '<div class="section-title"><h2>Bağlantılar & Sistem</h2></div><div class="grid2"><div class="panel"><h3>Entegrasyon Durumu</h3><ul class="list-dots"><li><span>Yemeksepeti API</span><span class="badge orange">Bağlı değil</span></li><li><span>Trendyol Go API</span><span class="badge orange">Bağlı değil</span></li><li><span>Yazar Kasa / POS</span><span class="badge orange">Model bekleniyor</span></li><li><span>Mutfak yazıcısı</span><span class="badge orange">Bağlı değil</span></li><li><span>Yerel veritabanı</span><span class="badge blue">Demo modu</span></li></ul></div><div class="panel"><h3>Gerçek Sistem Planı</h3><p class="info">GitHub Pages sadece tasarım önizlemesini yayınlıyor. Gerçek sistemde restoran laptopu yerel arka uç, veritabanı, API bağlantıları ve yazıcıyı yönetecek. Telefonlar aynı Wi-Fi üzerinden bağlanacak. Bu demo gerçek sipariş kabul etmez.</p><div class="actions" style="margin-top:16px"><a class="secondary" style="display:inline-block;border-radius:11px;padding:11px 14px;font-size:12px;font-weight:750" href="../nohut-menu/">QR Menüyü Aç ↗</a><button class="danger" data-reset>Demo Verisini Sıfırla</button></div></div></div>'}
function workerView(){var e=currentEmp();var open=data.orders.filter(function(o){return o.source==="Masa"&&due(o)>0});var chosen=workerTable?data.orders.find(function(o){return o.source==="Masa"&&o.table===workerTable&&due(o)>0}):null;return '<div class="worker-area"><div class="worker-intro"><span class="badge">MOBİL ÇALIŞAN ARAYÜZÜ</span><h2>Sipariş almak artık çok daha kolay.</h2><p>iPhone Safari veya Android Chrome ile çalışacak responsive tasarım. Masa açma, ürün ekleme ve personel kaydı gibi işlemleri burada deneyebilirsiniz.</p><div class="panel"><h3>Test personeli</h3><select class="field" id="staffSelect" style="width:100%;margin-top:10px">'+data.employees.filter(function(x){return x.active}).map(function(x){return '<option value="'+x.id+'" '+(x.id===worker?"selected":"")+'>'+safe(x.name)+' · '+x.role+'</option>'}).join("")+'</select><p class="footnote">Bu rol değişimi sadece önizlemedir. Gerçek sürüm parola ile giriş yapacak.</p><div class="actions"><button class="secondary" data-new="Gel-Al">+ Gel-Al</button><button class="secondary" data-new="Telefon">+ Telefon</button></div></div></div><div class="phone"><div class="phone-top"><div style="display:flex;justify-content:space-between;align-items:center"><strong>NOHUT <span style="color:#d2b883">FALAFEL</span></strong><span>☰</span></div><small>Merhaba '+safe(e.name)+' · Sipariş yönetimi</small></div><div class="phone-body"><div class="panel-header"><div><h3>Masalar</h3><p class="sub">Sipariş için masa seçin</p></div><span class="badge">'+open.length+' açık</span></div><div class="phone-tables">'+Array.from({length:8},function(_,i){var n=i+1,o=open.find(function(x){return x.table===n});return '<button class="phone-card '+(o?'open':'')+'" data-worker-table="'+n+'"><strong>Masa '+n+'</strong><small>'+(o?money(due(o)):'Boş · Sipariş aç')+'</small></button>'}).join("")+'</div>'+(workerTable?'<div class="phone-form"><h3 style="margin:0 0 12px">Masa '+workerTable+' '+(chosen?'· '+money(due(chosen)):'· Yeni Sipariş')+'</h3><select class="field" id="workerProduct">'+MENU.map(function(p){return '<option value="'+p.id+'">'+safe(p.name)+' · '+money(p.price)+'</option>'}).join("")+'</select><button class="primary" style="width:100%" data-worker-add="'+workerTable+'">'+(chosen?"Ek Sipariş Gönder":"Siparişi Oluştur")+'</button><p class="tiny sub" style="margin-top:10px">İşlemi yapan: '+safe(e.name)+'</p></div>':'')+'<div class="phone-dock"><button data-mode="admin">◫ Yönetim</button><span>▦ Masalar</span><button data-new="Gel-Al">＋ Gel-Al</button></div></div></div></div>'}
function render(){var section=mode==="staff"?workerView():tab==="dashboard"?dashboard():tab==="orders"?orderView():tab==="tables"?tableView():tab==="payments"?paymentView():tab==="employees"?employeeView():tab==="reports"?reportView():settingsView();document.getElementById("root").innerHTML='<div class="app"><aside class="sidebar"><div class="brand"><img src="../nohut-menu/assets/original-logo.jpeg" alt="Nohut Falafel logo"><div><strong>NOHUT FALAFEL</strong><small>İŞLETME SİSTEMİ</small></div></div><div class="nav-title">YÖNETİM</div><nav class="nav">'+pages.map(function(p){return '<button data-tab="'+p[0]+'" class="'+(mode==="admin"&&tab===p[0]?"active":"")+'"><span class="glyph">'+p[1]+'</span>'+p[2]+'</button>'}).join("")+'</nav><div class="sidebottom"><b style="font-size:12px">● Tasarım Önizlemesi</b><p>Gerçek API, ödeme, veritabanı ve yazıcı bağlantısı içermez.</p><a href="../nohut-menu/">QR Menüye Git ↗</a></div></aside><main class="main"><header class="top"><div class="top-left"><div><span class="eyebrow">Nohut Falafel / '+(mode==="staff"?"Personel":"Yönetim")+'</span><h1>'+(mode==="staff"?"Personel Paneli":(pages.find(function(p){return p[0]===tab})||pages[0])[2])+'</h1></div></div><div class="top-actions"><span class="chip">● Demo aktif</span><button class="switch" data-mode="'+(mode==="admin"?"staff":"admin")+'">'+(mode==="admin"?"📱 Personel Görünümü":"◫ Yönetici Paneli")+'</button><span class="av">Ö</span></div></header><div class="demo-banner">⚠ <b>GÖRSEL DEMO:</b> Tüm satışlar, personel işlemleri, platform siparişleri ve ödeme sonuçları örnektir. Bu site gerçek sipariş almaz veya POS cihazını çalıştırmaz.</div>'+section+'<p class="footnote">Nohut Falafel · UI Concept · Flutter/Dart uygulaması için tasarım referansı · <a href="../nohut-menu/"><u>QR Menu</u></a></p></main></div>'}
function toast(t){var e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},3300)}
function create(source,table){if(source==="Masa"){var t=Number(table)||[1,2,3,4,5,6,7,8].find(function(n){return !data.orders.some(function(o){return o.source==="Masa"&&o.table===n&&due(o)>0})});if(!t){toast("Tüm masalar dolu.");return}var existing=data.orders.find(function(o){return o.source==="Masa"&&o.table===t&&due(o)>0});if(existing){selected=existing.id;tab="orders";mode="admin";render();return}table=t}var person=mode==="staff"?currentEmp().name:"Ömer";var id=Math.max.apply(null,data.orders.map(function(o){return o.id}))+1;var o={id:id,source:source,table:table||null,staff:person,at:new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}),items:[],payments:[],events:[]};o.events.push(o.at+" · "+person+" — Sipariş açıldı");data.orders.unshift(o);selected=id;if(source==="Masa"&&mode==="staff"){workerTable=table}else{tab="orders";mode="admin"}render();toast("Sipariş #"+id+" açıldı. Ürün ekleyin.")}
function addProduct(o,prod,person){if(!o)return;if(!prod)return;o.items.push({id:prod,qty:1});var msg=new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})+" · "+person+" — +1 "+item(prod).name;o.events.push(msg);render();toast("Ek sipariş kaydedildi: "+item(prod).name+" (demo)")}
document.addEventListener("change",function(e){if(e.target.id==="staffSelect"){worker=Number(e.target.value);render()}});
document.addEventListener("click",function(e){var b=e.target.closest("[data-tab],[data-mode],[data-open],[data-filter],[data-table],[data-worker-table],[data-new],[data-add],[data-worker-add],[data-pay],[data-method],[data-split],[data-user-add],[data-user-edit],[data-user-toggle],[data-reset],[data-print],[data-export]");if(!b)return;
if(b.dataset.tab){tab=b.dataset.tab;mode="admin";render();return}
if(b.dataset.mode){mode=b.dataset.mode;render();return}
if(b.dataset.open){selected=Number(b.dataset.open);tab="orders";mode="admin";render();return}
if(b.dataset.filter){filter=b.dataset.filter;render();return}
if(b.dataset.table){create("Masa",Number(b.dataset.table));return}
if(b.dataset.workerTable){workerTable=Number(b.dataset.workerTable);render();return}
if(b.dataset.new){create(b.dataset.new,null);return}
if(b.dataset.add){addProduct(order(b.dataset.add),document.getElementById("addProduct").value,"Ömer");return}
if(b.dataset.workerAdd){var t=Number(b.dataset.workerAdd),prod=document.getElementById("workerProduct").value;var o=data.orders.find(function(x){return x.source==="Masa"&&x.table===t&&due(x)>0});if(!o){create("Masa",t);o=order(selected)}addProduct(o,prod,currentEmp().name);return}
if(b.dataset.method){method=b.dataset.method;render();return}
if(b.dataset.split){split=b.dataset.split;render();return}
if(b.dataset.pay){var o=order(b.dataset.pay),amount=due(o);if(!o||amount<=0)return;if(split==="Yarısı")amount=Math.round(amount/2*100)/100;if(split==="Özel Tutar"){var response=prompt("Tahsil edilecek tutar (₺)",String(amount));if(response===null)return;amount=Number(response.replace(",","."));if(!Number.isFinite(amount)||amount<=0||amount>due(o)){toast("Geçerli tutar girin.");return}}o.payments.push({method:method,amount:amount,by:"Ömer"});o.events.push(new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})+" · Ömer — "+method+" "+money(amount)+" (Demo)");render();toast("SADECE DEMO: "+money(amount)+" "+method+" olarak işlendi.");return}
if(b.hasAttribute("data-user-add")){var name=prompt("Personel adı:");if(!name||!name.trim())return;data.employees.push({id:Math.max.apply(null,data.employees.map(function(e){return e.id}))+1,name:name.trim().slice(0,70),role:"Personel",active:true});render();toast("Demo personel hesabı eklendi.");return}
if(b.dataset.userEdit){var u=emp(Number(b.dataset.userEdit));if(!u)return;var n=prompt("Personelin yeni adı:",u.name);if(n===null||!n.trim())return;var old=u.name;u.name=n.trim().slice(0,70);data.orders.forEach(function(o){if(o.staff===old)o.staff=u.name});render();toast("Personel güncellendi (demo).");return}
if(b.dataset.userToggle){var u2=emp(Number(b.dataset.userToggle));if(!u2||u2.id===1)return;u2.active=!u2.active;if(!emp(worker).active)worker=1;render();toast("Personel durumu değiştirildi.");return}
if(b.hasAttribute("data-reset")){data=JSON.parse(JSON.stringify(INITIAL));tab="dashboard";selected=1021;worker=2;workerTable=null;render();toast("Örnek veriler sıfırlandı.");return}
if(b.dataset.print){var o2=order(b.dataset.print);document.getElementById("print-sheet").innerHTML='<h2>NOHUT FALAFEL</h2><p>*** DEMO / FİSKAL FİŞ DEĞİLDİR ***</p><div>#'+o2.id+' · '+safe(o2.source)+(o2.table?" / Masa "+o2.table:"")+'</div><div>Personel: '+safe(o2.staff)+'</div>'+o2.items.map(function(i){return '<div>'+i.qty+' × '+safe(item(i.id).name)+' — '+money(item(i.id).price*i.qty)+'</div>'}).join("")+'<div><b>TOPLAM: '+money(total(o2))+'</b></div><p>Bu sadece yazdırma önizlemesidir.</p>';window.print();return}
if(b.hasAttribute("data-export")){var csv="Kaynak,SiparisNo,Personel,Tutar,TahsilEdilen,Kalan\n"+data.orders.map(function(o){return [o.source,o.id,o.staff,total(o),paid(o),due(o)].map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(",")}).join("\n");var url=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));var a=document.createElement("a");a.href=url;a.download="nohut-demo-rapor.csv";a.click();setTimeout(function(){URL.revokeObjectURL(url)},500);return}
});
render();
})();
</script></body></html>
