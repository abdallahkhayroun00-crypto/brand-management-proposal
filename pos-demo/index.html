var tab="dashboard",mode="admin",selectedId=null,sourceFilter="Tümü",payMethod="Nakit",paySplit="Tamamı",activeWorkerId=2;
var workerStep="home",orderType="Masa",tableChoice=null,targetOrderId=null,cart=[],catalogCat="all",query="",editingIndex=null,customProduct=null,customQty=1,customRemoved=[],customNote="";
var pages=[["dashboard","◫","Genel Bakış"],["orders","▣","Siparişler"],["tables","▦","Masalar"],["payments","◈","Ödemeler & Kasa"],["employees","♙","Personel Yönetimi"],["reports","▥","Raporlar"],["settings","⚙","Ayarlar"]];
var sources=["Masa","Gel-Al","Telefon","Yemeksepeti","Trendyol Go"];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function price(n){return n===null?"Fiyat girilmemiş":(n||0).toLocaleString("tr-TR",{maximumFractionDigits:2})+" ₺"}
function product(id){return MENU.find(function(x){return x.id===Number(id)})}
function lines(o){return o.batches.reduce(function(a,b){return a.concat(b.lines)},[])}
function total(o){return lines(o).reduce(function(a,l){return a+(l.price||0)*l.qty},0)}
function paid(o){return o.payments.reduce(function(a,p){return a+p.amount},0)}
function due(o){return Math.max(0,Math.round((total(o)-paid(o))*100)/100)}
function status(o){return o.batches.length===0?"Ürün Bekliyor":due(o)===0?"Ödendi":paid(o)>0?"Kısmi Ödendi":"Açık Hesap"}
function statusClass(o){return due(o)===0?"":paid(o)>0?"blue":"orange"}
function isPlatform(o){return o.source==="Yemeksepeti"||o.source==="Trendyol Go"}
function order(id){return state.orders.find(function(o){return o.id===Number(id)})}
function emp(id){return state.employees.find(function(x){return x.id===Number(id)})}
function staff(){return emp(activeWorkerId)||state.employees.find(function(x){return x.active})||state.employees[0]}
function openTable(n){return state.orders.find(function(o){return o.source==="Masa"&&o.table===n&&o.batches.length&&due(o)>0})}
function sum(orders,f){return orders.reduce(function(a,x){return a+f(x)},0)}
function moneySum(method){return sum(state.orders,function(o){return sum(o.payments.filter(function(p){return p.method===method}),function(p){return p.amount})})}
function stats(){return {registered:sum(state.orders,total),cash:moneySum("Nakit"),card:moneySum("Kart"),platform:moneySum("Platform"),pending:sum(state.orders,due)}}
function toast(s){var old=document.querySelector(".toast");if(old)old.remove();var d=document.createElement("div");d.className="toast";d.textContent=s;document.body.appendChild(d);setTimeout(function(){d.remove()},3300)}
function box(label,num,icon,sub){return '<div class="metric"><div class="metric-top">'+esc(label)+'<span class="metric-icon">'+icon+'</span></div><strong>'+num+'</strong><small>'+esc(sub)+'</small></div>'}
function statusHtml(o){return '<span class="badge '+statusClass(o)+'">'+status(o)+'</span>'}
function orderRows(os){return os.length?'<div class="table-scroll"><table class="table"><thead><tr><th>Sipariş</th><th>Kaynak</th><th>Alan Personel</th><th>Toplam</th><th>Kalan</th><th>Durum</th><th></th></tr></thead><tbody>'+os.map(function(o){var first=o.batches[0];return '<tr><td><b>#'+o.id+'</b><div class="small-muted">'+esc(o.created)+(o.table?" · Masa "+o.table:"")+'</div></td><td>'+esc(o.source)+'</td><td>'+esc(first?first.staff:"Henüz yok")+'</td><td>'+price(total(o))+'</td><td>'+price(due(o))+'</td><td>'+statusHtml(o)+'</td><td><button class="quiet" data-open="'+o.id+'">İncele</button></td></tr>'}).join("")+'</tbody></table></div>':'<div class="empty">Sipariş bulunamadı.</div>'}
function dashboard(){var s=stats();var bands=sources.map(function(src){return {name:src,value:sum(state.orders.filter(function(o){return o.source===src}),total)}});var max=Math.max(1,...bands.map(function(x){return x.value}));return '<div class="hero"><div><span class="eyebrow" style="color:#b7d6c0">NOHUT FALAFEL · YÖNETİM</span><h2>Merhaba, Ömer 👋</h2><p>Masa, personel, ödeme ve satışlar tek ekranda.</p></div><div class="hero-badge">Açık Masalar<strong>'+Array.from({length:8},function(_,i){return openTable(i+1)?1:0}).reduce(function(a,b){return a+b},0)+'</strong>Demo</div></div><div class="metrics">'+box("Kayıtlı Sipariş Tutarı",price(s.registered),"↗","Açık hesaplar dahil")+box("Nakit Tahsilat",price(s.cash),"▤","Kasada kayıtlı")+box("Kart / POS",price(s.card),"▣","Simüle edilen")+box("Kalan Tutar",price(s.pending),"◷","Henüz tahsil edilmemiş")+'</div><div class="grid2"><section class="panel"><div class="panel-header"><div><h3>Satış Kaynakları</h3><p class="sub">Tüm sipariş kanallarının örnek tutar dağılımı</p></div><span class="pill">QR menü fiyatları</span></div>'+bands.map(function(x){return '<div class="source-bar"><label>'+esc(x.name)+'</label><div class="bar-bg"><div class="bar-fill" style="width:'+Math.round(x.value/max*100)+'%"></div></div><b>'+price(x.value)+'</b></div>'}).join("")+'</section><section class="panel"><h3>Tahsilat Ayrımı</h3><div class="payline"><span class="round">▤</span><div><small>Nakit</small><b>'+price(s.cash)+'</b></div></div><div class="payline"><span class="round">▣</span><div><small>Restoran Kart</small><b>'+price(s.card)+'</b></div></div><div class="payline"><span class="round">⇄</span><div><small>Platformda ödenmiş (brüt)</small><b>'+price(s.platform)+'</b></div></div><p class="info">Platform komisyonları ve banka mutabakatı bu tasarım demosunda bulunmaz.</p></section></div><div class="section-title"><h2>Son Siparişler</h2><button class="quiet" data-tab="orders">Tümünü Gör</button></div><div class="panel">'+orderRows(state.orders.slice().reverse().slice(0,6))+'</div>'}
function detail(o){if(!o)return "";return '<div class="section-title"><h2>Sipariş #'+o.id+(o.table?" · Masa "+o.table:"")+'</h2>'+statusHtml(o)+'</div><div class="detail-grid"><div class="panel"><div class="panel-header"><div><h3>'+esc(o.source)+' · '+esc(o.created)+'</h3><p class="sub">Ürün ve işlem geçmişi</p></div><button class="quiet" data-print="'+o.id+'">⎙ Fiş Önizle</button></div>'+o.batches.map(function(b,i){return '<div class="batch"><div class="batch-heading"><span>'+(i?"EK SİPARİŞ":"İLK SİPARİŞ")+' · '+esc(b.staff)+'</span><span>'+esc(b.time)+'</span></div>'+b.lines.map(function(l){var p=product(l.productId);return '<div class="line"><span>'+l.qty+'× '+esc(p?p.name:"Ürün")+'</span><strong>'+price(l.price*l.qty)+'</strong></div>'+(l.removed.length?'<p class="line-note">Çıkar: '+esc(l.removed.join(", "))+'</p>':"")+(l.note?'<p class="line-note">Not: '+esc(l.note)+'</p>':"")}).join("")+'<button class="quiet" style="margin-top:8px" data-print="'+o.id+'" data-batch="'+i+'">Ek/Parti fişi</button></div>'}).join("")+'<div class="line tot"><span>Toplam</span><strong>'+price(total(o))+'</strong></div><div class="line"><span>Tahsil edilen</span><b>'+price(paid(o))+'</b></div><div class="line tot"><span>Kalan</span><strong>'+price(due(o))+'</strong></div>'+(!isPlatform(o)&&due(o)>0?'<button class="secondary" style="margin-top:15px" data-editorder="'+o.id+'">+ Ek Sipariş (Personel Ekranı)</button>':"")+'</div><div class="panel"><h3>Ödeme Kaydı (Demo)</h3><p class="sub">POS entegrasyonu henüz yok; burada gerçek para alınmaz.</p>'+(isPlatform(o)?'<p class="info-alert">Platform siparişi: burada ikinci kez kart/nakit tahsilatı yapılmaz.</p>':'<div class="seg">'+["Nakit","Kart"].map(function(x){return '<button class="'+(payMethod===x?"active":"")+'" data-method="'+x+'">'+x+'</button>'}).join("")+'</div><div class="seg">'+["Tamamı","Yarısı","Özel Tutar"].map(function(x){return '<button class="'+(paySplit===x?"active":"")+'" data-split="'+x+'">'+x+'</button>'}).join("")+'</div><button class="primary" style="width:100%;margin:9px 0 15px" '+(due(o)<=0?'disabled':"")+' data-pay="'+o.id+'">Ödeme Kaydet (Simülasyon)</button>')+'<h3 style="font-size:13px;margin-top:8px">Tahsilatlar</h3>'+(o.payments.length?o.payments.map(function(p){return '<div class="line"><span>'+esc(p.method)+' · '+esc(p.by)+'</span><strong>'+price(p.amount)+'</strong></div>'}).join(""):'<p class="sub">Henüz tahsilat yok.</p>')+'<div class="mini-box"><small>Denetim Kaydı</small>'+o.events.slice().reverse().map(function(e){return '<p class="tiny" style="line-height:1.5;margin:9px 0">'+esc(e)+'</p>'}).join("")+'</div></div></div>'}

function settingsPage(){return '<div class="section-title"><h2>Ayarlar & Entegrasyon</h2></div><div class="grid2"><div class="panel"><h3>Bağlantı Durumu</h3><ul class="list-dots"><li>Yemeksepeti API <span class="badge orange">Bağlı değil</span></li><li>Trendyol Go API <span class="badge orange">Bağlı değil</span></li><li>POS / ÖKC <span class="badge orange">Model bekleniyor</span></li><li>Mutfak yazıcısı <span class="badge orange">Bağlı değil</span></li><li>QR Menü Ürünleri <span class="badge">Dosyadan okundu · '+MENU.length+'</span></li></ul></div><div class="panel"><h3>Demo Bilgisi</h3><p class="info">Bu açık GitHub Pages sayfası yalnızca görünüm ve örnek sipariş akışını gösterir. Kayıtlar yalnızca kullandığınız tarayıcıda tutulur; farklı telefonlarla senkronize olmaz. Gerçek API, banka, fiş veya yazıcı bağlantısı yoktur.</p><div class="actions" style="margin-top:15px"><a href="../nohut-menu/" class="secondary" style="padding:11px;border-radius:11px;font-size:12px;font-weight:800">QR Menü Aç ↗</a><button class="danger" data-reset>Demo Verisini Sıfırla</button></div></div></div>'}

function cartMarkup(){return '<div class="cart-head"><h3 style="margin:0;font-size:14px">Sipariş Sepeti</h3><span class="badge">'+cart.reduce(function(s,l){return s+l.qty},0)+' ürün</span></div>'+(cart.length?cart.map(function(l,i){var p=product(l.productId);return '<div class="cart-line"><div class="line"><strong>'+l.qty+'× '+esc(p.name)+'</strong><b>'+price(l.price*l.qty)+'</b></div>'+(l.removed.length?'<p>🚫 Çıkar: '+esc(l.removed.join(", "))+'</p>':"")+(l.note?'<p>✎ '+esc(l.note)+'</p>':"")+'<div class="cart-actions"><button data-cart-edit="'+i+'">Düzenle</button><button data-cart-remove="'+i+'">Sil</button></div></div>'}).join(""):'<div class="empty">Sepet boş. Ürün seçin ve istekleri ekleyin.</div>')+'<div class="worker-footer"><div class="line tot"><span>Yeni sipariş</span><strong>'+price(cartValue())+'</strong></div><button class="primary" data-cart-submit '+(cart.length?"":"disabled")+'>✓ '+(oText())+'</button></div>'}
function oText(){return targetOrderId?"Ek Siparişi Gönder":"Siparişi Gönder"}
function workerPage(){return '<div class="staff-dash"><div class="staff-helper"><span class="badge">MOBİL PERSONEL ARAYÜZÜ</span><h2>Tüm QR menü ürünleri, tek ekranda.</h2><p>Masa, Gel-Al veya Telefon seçin. Ürünün belirtilmiş içeriklerini görün, istenmeyenleri çıkarın, özel not ekleyin ve birden çok ürünü sepete koyup gönderin. Ek sipariş aynı adisyona eklenir.</p><div class="panel"><h3>Demo personeli</h3><p class="sub">Bu açık önizlemede kullanıcı değişikliği giriş sistemi değildir.</p><select class="field" id="staffSelect" style="width:100%;margin-top:12px">'+employeeOption()+'</select><p class="footnote">Değişiklikler sadece bu tarayıcının demo alanında saklanır; laptop/telefon arasında gerçek eşzamanlama yok.</p></div></div><div class="worker-phone"><div class="worker-top"><div style="display:flex;justify-content:space-between;align-items:center"><strong>NOHUT <span style="color:#f0c778">FALAFEL</span></strong><span>▣ Personel</span></div><p>Merhaba, '+esc(staff().name)+' · Sipariş giriş ekranı</p><select class="field" id="staffSelectMobile" style="margin-top:13px;width:100%;font-size:12px">'+employeeOption()+'</select></div><div class="worker-content">'+(workerStep==="home"?workerHome():workerStep==="list"?workerList():catalog())+'</div></div></div>'}
function render(){var body=mode==="staff"?workerPage():tab==="dashboard"?dashboard():tab==="orders"?orderPage():tab==="tables"?tablePage():tab==="payments"?paymentPage():tab==="employees"?employeePage():tab==="reports"?reportPage():settingsPage();document.getElementById("root").innerHTML='<div class="app"><aside class="sidebar"><div class="brand"><img src="../nohut-menu/assets/original-logo.jpeg" alt="Nohut Falafel"><div><strong>NOHUT FALAFEL</strong><small>İŞLETME SİSTEMİ</small></div></div><div class="nav-title">YÖNETİM</div><nav class="nav">'+pages.map(function(p){return '<button data-tab="'+p[0]+'" class="'+(mode==="admin"&&tab===p[0]?"active":"")+'"><span class="glyph">'+p[1]+'</span>'+p[2]+'</button>'}).join("")+'</nav><div class="sidebottom"><b>● Tasarım Demosu</b><p>Yalnızca arayüz prototipi. Gerçek sistem bağlı değildir.</p><a href="../nohut-menu/">QR Menüyü Aç ↗</a></div></aside><main class="main"><header class="top"><div class="top-left"><div><span class="eyebrow">Nohut Falafel / '+(mode==="staff"?"Personel":"Yönetim")+'</span><h1>'+(mode==="staff"?"Personel Sipariş Ekranı":pages.find(function(p){return p[0]===tab})[2])+'</h1></div></div><div class="top-actions"><span class="chip">● Demo</span><button class="switch" data-mode="'+(mode==="admin"?"staff":"admin")+'">'+(mode==="admin"?"📱 Personel Görünümü":"◫ Yönetici Paneli")+'</button><span class="av">Ö</span></div></header><div class="demo-banner">⚠ <b>DEMO / GERÇEK DEĞİL:</b> Fiyatlar ve açıklamalar QR Menü dosyasından okunur. Veriler yalnızca bu tarayıcıda kalır. Gerçek API, POS, fiş, mutfak yazıcısı, hesap girişi veya cihaz senkronizasyonu yoktur.</div>'+body+'<p class="footnote">Nohut Falafel · Flutter/Dart için arayüz önizlemesi · <a href="../nohut-menu/"><u>QR Menü</u></a> · Kaynak ürün sayısı: '+MENU.length+'</p></main></div>'}
function setCustom(id,index){var p=product(id);if(!p||p.price===null)return;customProduct=p.id;editingIndex=index==null?null:index;var l=index==null?null:cart[index];customQty=l?l.qty:1;customRemoved=l?l.removed.slice():[];customNote=l?l.note:"";render()}
function submitCart(){if(!cart.length)return;var name=staff().name,o=targetOrderId?order(targetOrderId):null;if(!o){o=newOrder(orderType,tableChoice,name,[]);targetOrderId=o.id;}if(due(o)===0&&o.batches.length){toast("Bu sipariş kapanmış, yeni hesap açın.");return}var b={id:o.batches.length+1,staff:name,time:at(),lines:clone(cart)};o.batches.push(b);o.events.push(b.time+" · "+name+" — "+(o.batches.length===1?"Sipariş":"Ek Sipariş")+" ("+cart.length+" satır)");save();cart=[];workerStep="home";tableChoice=null;targetOrderId=null;customProduct=null;render();toast("Sipariş #"+o.id+" kaydedildi. Ek fiş kaydı oluşturuldu (demo).")}
function csv(){var rows=[["Kaynak","Sipariş","Masa","Alınan","Toplam","Nakit","Kart","Platform","Kalan"]];state.orders.forEach(function(o){rows.push([o.source,o.id,o.table||"",o.batches[0]?o.batches[0].staff:"",total(o),sum(o.payments.filter(function(p){return p.method==="Nakit"}),function(p){return p.amount}),sum(o.payments.filter(function(p){return p.method==="Kart"}),function(p){return p.amount}),sum(o.payments.filter(function(p){return p.method==="Platform"}),function(p){return p.amount}),due(o)])});var content=rows.map(function(row){return row.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\n");var url=URL.createObjectURL(new Blob(["\ufeff"+content],{type:"text/csv;charset=utf-8"}));var a=document.createElement("a");a.href=url;a.download="nohut-pos-demo.csv";a.click();setTimeout(function(){URL.revokeObjectURL(url)},500)}
function printOrder(o,batchIndex){var batches=batchIndex===null?o.batches:[o.batches[batchIndex]];document.getElementById("print-sheet").innerHTML='<h2>NOHUT FALAFEL</h2><p>*** DEMO – MALİ FİŞ DEĞİL ***</p><div>#'+o.id+' · '+esc(o.source)+(o.table?" · Masa "+o.table:"")+'</div>'+batches.map(function(b){return '<div>'+esc(b.time)+' · Personel: '+esc(b.staff)+'</div>'+b.lines.map(function(l){var p=product(l.productId);return '<div>'+l.qty+' × '+esc(p.name)+' · '+price(l.price*l.qty)+(l.removed.length?' / ÇIKAR: '+esc(l.removed.join(",")):"")+(l.note?' / NOT: '+esc(l.note):"")+'</div>'}).join("")}).join("")+'<div>Toplam: '+price(total(o))+'</div><p>Bu yalnızca yazdırma önizlemesidir.</p>';window.print()}
document.addEventListener("input",function(e){if(e.target.id==="productSearch"){query=e.target.value;var q=query.toLocaleLowerCase("tr-TR");document.querySelectorAll(".item-tile[data-name]").forEach(function(b){b.style.display=b.dataset.name.indexOf(q)<0?"none":""})}if(e.target.id==="customNote")customNote=e.target.value});
document.addEventListener("change",function(e){if(e.target.id==="staffSelect"||e.target.id==="staffSelectMobile"){activeWorkerId=Number(e.target.value);render()}if(e.target.hasAttribute("data-ingredient")){var p=product(customProduct),ing=listIngredients(p)[Number(e.target.dataset.ingredient)];if(!ing)return;if(e.target.checked){if(!customRemoved.includes(ing))customRemoved.push(ing)}else{customRemoved=customRemoved.filter(function(v){return v!==ing})}}});
document.addEventListener("click",function(e){var b=e.target.closest("button[data-tab],button[data-mode],button[data-open],button[data-filter],button[data-table],button[data-method],button[data-split],button[data-pay],button[data-addstaff],button[data-staff-edit],button[data-staff-toggle],button[data-reset],button[data-export],button[data-print],button[data-open-worker],button[data-editorder],button[data-worker-home],button[data-worker-list],button[data-worker-table],button[data-worker-type],button[data-worker-existing],button[data-category],button[data-product],button[data-custom-back],button[data-custom-qty],button[data-cart-save],button[data-cart-edit],button[data-cart-remove],button[data-cart-submit]");if(!b)return;
if(b.dataset.tab){mode="admin";tab=b.dataset.tab;selectedId=null;render();return}
if(b.dataset.mode){mode=b.dataset.mode;if(mode==="staff")workerStep="home";render();return}
if(b.dataset.open){selectedId=Number(b.dataset.open);mode="admin";tab="orders";render();return}
if(b.dataset.filter){sourceFilter=b.dataset.filter;selectedId=null;render();return}
if(b.dataset.table){var n=Number(b.dataset.table),o=openTable(n);if(o){selectedId=o.id;tab="tables";render()}else{chooseOrder("Masa",n,null)}return}
if(b.dataset.openWorker){mode="staff";workerStep="home";render();return}
if(b.dataset.editorder){var eo=order(b.dataset.editorder);if(!eo||isPlatform(eo)||due(eo)===0)return;chooseOrder(eo.source,eo.table,eo.id);return}
if(b.dataset.workerHome!==undefined){workerStep="home";customProduct=null;render();return}
if(b.dataset.workerList!==undefined){workerStep="list";render();return}
if(b.dataset.workerTable){var nt=Number(b.dataset.workerTable),ot=openTable(nt);chooseOrder("Masa",nt,ot?ot.id:null);return}
if(b.dataset.workerType){chooseOrder(b.dataset.workerType,null,null);return}
if(b.dataset.workerExisting){var ow=order(b.dataset.workerExisting);chooseOrder(ow.source,ow.table,ow.id);return}
if(b.dataset.category){catalogCat=b.dataset.category;render();return}
if(b.dataset.product){setCustom(Number(b.dataset.product),null);return}
if(b.dataset.customBack!==undefined){customProduct=null;editingIndex=null;render();return}
if(b.dataset.customQty){customQty=Math.max(1,Math.min(99,customQty+Number(b.dataset.customQty)));render();return}
if(b.dataset.cartSave!==undefined){var cp=product(customProduct);if(!cp)return;var line={productId:cp.id,price:cp.price,qty:customQty,removed:customRemoved.slice(),note:customNote.trim()};if(editingIndex===null)cart.push(line);else cart[editingIndex]=line;customProduct=null;editingIndex=null;render();toast("Ürün sepete eklendi (demo).");return}
if(b.dataset.cartEdit){setCustom(cart[Number(b.dataset.cartEdit)].productId,Number(b.dataset.cartEdit));return}
if(b.dataset.cartRemove){cart.splice(Number(b.dataset.cartRemove),1);render();return}
if(b.dataset.cartSubmit!==undefined){submitCart();return}
if(b.dataset.method){payMethod=b.dataset.method;render();return}
if(b.dataset.split){paySplit=b.dataset.split;render();return}
if(b.dataset.pay){var po=order(b.dataset.pay);if(!po||isPlatform(po)||due(po)<=0)return;var amount=due(po);if(paySplit==="Yarısı")amount=Math.round(amount/2*100)/100;if(paySplit==="Özel Tutar"){var resp=prompt("Tahsil edilecek tutar (₺)",String(amount));if(resp===null)return;amount=Number(resp.replace(",","."));if(!Number.isFinite(amount)||amount<=0||amount>due(po)){toast("Geçerli bir tutar girin.");return}}po.payments.push({method:payMethod,amount:amount,by:"Ömer",time:at()});po.events.push(at()+" · Ömer — "+payMethod+" "+price(amount)+" (Demo)");save();render();toast("Ödeme simülasyonu: "+price(amount));return}
if(b.dataset.addstaff!==undefined){var name=prompt("Yeni personel adı:");if(!name||!name.trim())return;var n=String(name).trim().slice(0,60);var next=Math.max.apply(null,state.employees.map(function(x){return x.id}))+1;state.employees.push({id:next,name:n,role:"Personel",active:true});save();render();toast("Demo personel eklendi.");return}
if(b.dataset.staffEdit){var ee=emp(b.dataset.staffEdit);if(!ee)return;var n2=prompt("Personel adı:",ee.name);if(!n2||!n2.trim())return;var role=prompt("Rol (Yönetici veya Personel):",ee.role);if(role===null)return;ee.name=n2.trim().slice(0,60);ee.role=role==="Yönetici"?"Yönetici":"Personel";save();render();toast("Personel düzenlendi.");return}
if(b.dataset.staffToggle){var et=emp(b.dataset.staffToggle);if(!et||et.id===1)return;et.active=!et.active;if(!staff().active)activeWorkerId=1;save();render();toast("Personel hesabının durumu değiştirildi.");return}
if(b.dataset.reset!==undefined){if(!confirm("Bu tarayıcıdaki örnek kayıtlar sıfırlansın mı?"))return;seed();save();selectedId=null;workerStep="home";cart=[];render();toast("Demo sıfırlandı.");return}
if(b.dataset.export!==undefined){csv();return}
if(b.dataset.print){var op=order(b.dataset.print);if(op)printOrder(op,b.dataset.batch===undefined?null:Number(b.dataset.batch));return}
});
render();
})();
</script></body></html>
