var lastRaw=null;

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n){return (Number(n)||0).toLocaleString("tr-TR",{minimumFractionDigits:0,maximumFractionDigits:2})+" ₺"}
function asMoney(c){return money(c/100)}
function cent(n){return Math.round((Number(n)||0)*100)}
function amt(s){return moneyCents(s)}
function lines(){var a=[];order.batches.forEach(function(b){b.lines.forEach(function(l,i){if(l.voided||l.correction)return;var x=data[l.productId],p=cent(l.price),name=l.name||(x?x[1]:"Ürün");a.push({key:b.id+":"+i,name:name,qty:l.qty,unit:p,total:p*l.qty,note:l.note||"",removed:l.removed||[]})})});return a}
function total(){return lines().reduce(function(s,l){return s+l.total},0)}
function paid(){return order.payments.reduce(function(s,p){return s+(p.reversed?0:cent(p.amount))},0)}
function remaining(){return Math.max(0,total()-paid())}
function guests(){return order.guestChecks}
function allocated(ch){return ch.allocations.reduce(function(s,a){return s+a.cents},0)}
function receivedBy(ch){return order.payments.reduce(function(s,p){if(p.reversed)return s;if(p.guestCheckId===ch.id)return s+cent(p.amount);return s+(p.guestAllocations||[]).filter(function(a){return a.guestCheckId===ch.id}).reduce(function(n,a){return n+cent(a.amount)},0)},0)}

function unmatchedPayment(p){return p.reversed||p.guestCheckId?0:Math.max(0,cent(p.amount)-(p.guestAllocations||[]).reduce(function(n,a){return n+cent(a.amount)},0))}

 if(paid()>0){alert("Mevcut ödemeler var. Ödenmiş payları bozmadan ürünlere göre bölün.");return}

var splitLocal=(function(){var l=window.location||{};return {

 if(order&&(!order.guestChecks||!order.guestChecks.length)&&remaining()>0){
  order.guestChecks=[{id:1,name:"Kişi 1",allocations:[]},{id:2,name:"Kişi 2",allocations:[]}]; // Show a draft split without writing on page open.
 }

}

 var payload=splitLocal.pending,base=splitLocal.version;splitLocal.pending=null;splitLocal.busy=true;

 .then(function(r){return r.json().then(function(body){return {status:r.status,body:body}})})
 .then(function(result){
  splitLocal.busy=false;
  if(result.status===409){
   splitLocal.blocked=true;splitLocal.pending=null;
   if(result.body&&result.body.state){var raw=JSON.stringify(result.body.state);localStorage.setItem(KEY,raw);lastRaw=raw}
   alert("Başka cihaz siparişi değiştirdi. Değişiklik yerel sunucuda kabul edilmedi. Güncel hesabı kontrol edin.");location.reload();return
  }
  if(result.status!==200||!result.body.ok){splitFailure("Ödeme sunucuya kaydedilmedi");return}
  splitLocal.version=result.body.revision;
  if(splitLocal.pending)splitFlush();
  else splitNotice("● Laptop SQLite kaydı onaylandı");

}

 .then(function(v){if(v.revision!==splitLocal.version)splitApply(v)}).catch(function(){splitFailure("Laptop / Wi-Fi bağlantısı kesildi")});
}
